name: Build LowBrowser Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Mobile Dependencies & Sync Capacitor
        run: |
          cd mobile
          npm install
          npx cap sync android

      - name: 🔨 Build Standalone Android APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../LowBrowser.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LowBrowser-Android-APK
          path: LowBrowser.apk

      - name: 🚀 Release APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: LowBrowser.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
